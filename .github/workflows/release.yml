name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify tag matches project versions
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag

          versions = {}
          for manifest in sorted(pathlib.Path("modules").glob("*/ros/*/package.xml")):
              versions[str(manifest)] = ET.parse(manifest).find("version").text.strip()
          for setup in sorted(pathlib.Path("modules").glob("*/ros/*/setup.py")):
              match = re.search(r'version\s*=\s*"([^"]+)"', setup.read_text())
              versions[str(setup)] = match.group(1) if match else None

          errors = [
              f"::error file={f}::Tag {tag} does not match version {v} in {f}"
              for f, v in versions.items()
              if v != expected
          ]
          for changelog in sorted(pathlib.Path("modules").glob("*/CHANGELOG.md")):
              if f"## {expected}" not in changelog.read_text().splitlines():
                  errors.append(f"::error file={changelog}::Missing '## {expected}' section in {changelog}")

          for error in errors:
              print(error)
          sys.exit(1 if errors else 0)
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "v${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag ${prerelease}
