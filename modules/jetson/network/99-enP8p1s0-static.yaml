network:
  version: 2
  renderer: NetworkManager
  ethernets:
    enP8p1s0:
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.2.4/24
      nameservers:
        addresses: [8.8.8.8, 8.8.4.4]
      routes:
        - to: default
          via: 192.168.2.1 # Gateway (device with WiFi connection, i.e., the topside computer)
          metric: 100
