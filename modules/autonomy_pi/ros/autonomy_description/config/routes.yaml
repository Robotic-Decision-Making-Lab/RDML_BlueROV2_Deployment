bar30_router:
  ros__parameters:
    # MAVROS publishes all incoming MAVLink messages to this topic, including
    # messages that aren't explicitly converted into their own ROS 2 message.
    incoming_topic: /uas1/mavlink_source

    # the topic that the router will publish the resulting depth estimates to.
    # state estimators should use this topic for depth estimation.
    outgoing_topic: /vehicle/depth

    # The frame the reported depth is expressed relative to. Depth is an absolute, world-vertical
    # quantity derived from pressure (not a point in the sensor's own moving mounting frame), so
    # this must be a world-fixed frame that robot_localization can resolve without needing its own
    # output (i.e. the EKF's world_frame/odom_frame) - NOT the "bar30" body/sensor frame. Using a
    # body frame here creates a circular dependency (odom -> base_link -> bar30, where odom ->
    # base_link is produced by the same EKF consuming this measurement) that destabilizes the filter.
    frame_id: "odom"
