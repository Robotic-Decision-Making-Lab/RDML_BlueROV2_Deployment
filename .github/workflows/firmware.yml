name: Firmware

on:
  push:
    branches:
      - main
    paths:
      - hardware/teensy/**
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - hardware/teensy/**
      - .github/workflows/firmware.yml
  workflow_dispatch:

jobs:
  build:
    name: Build Teensy Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('hardware/teensy/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        working-directory: hardware/teensy
        run: pio run
