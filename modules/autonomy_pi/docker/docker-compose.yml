services:
  ros:
    image: autonomy-pi:lyrical
    build:
      context: ..
      dockerfile: docker/Dockerfile
    platform: linux/arm64
    network_mode: host
    ipc: host
    restart: on-failure
    volumes:
      - /home/neptune/.ros:/home/ubuntu/.ros
    # uncomment the following for interactive mode
    command: tail -f /dev/null

  core:
    extends: ros
    container_name: autonomy-core
    devices:
      - /dev/i2c-1:/dev/i2c-1
    group_add:
      - "${I2C_GID:-993}"
    command: ros2 launch autonomy_bringup core.launch.yaml
    healthcheck:
      test:
        - CMD
        - /entrypoint.sh
        - bash
        - -c
        - ros2 node list --no-daemon --spin-time 3 | grep -q robot_state_publisher
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 15s

  estimation:
    extends: ros
    container_name: autonomy-estimation
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
    depends_on:
      core:
        condition: service_healthy
    command: ros2 launch autonomy_bringup estimation.launch.yaml

  controllers:
    extends: ros
    container_name: autonomy-controllers
    depends_on:
      core:
        condition: service_healthy
    command: ros2 launch autonomy_bringup controllers.launch.py
